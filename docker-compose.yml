services:
  mongo:
    image: mongo:7.0
    container_name: skydish-mongo
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: skydish-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/food_delivery_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkeyforfooddeliverymicroservices2025}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_SECURE=${MAIL_SECURE:-true}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM:-SkyDish Food Delivery}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  restaurant-service:
    build:
      context: ./backend/restaurant-service
      dockerfile: Dockerfile
    container_name: skydish-restaurant-service
    restart: unless-stopped
    ports:
      - "${REST_PORT:-5002}:5002"
    environment:
      - PORT=5002
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/food_delivery_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkeyforfooddeliverymicroservices2025}
    volumes:
      - restaurant-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: skydish-order-service
    restart: unless-stopped
    ports:
      - "${ORDER_PORT:-5005}:5005"
    environment:
      - PORT=5005
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/food_delivery_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkeyforfooddeliverymicroservices2025}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  delivery-service:
    build:
      context: ./delivery-service/backend
      dockerfile: Dockerfile
    container_name: skydish-delivery-service
    restart: unless-stopped
    ports:
      - "${DELIVERY_PORT:-5003}:5003"
    environment:
      - PORT=5003
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/food_delivery_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkeyforfooddeliverymicroservices2025}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: skydish-payment-service
    restart: unless-stopped
    ports:
      - "${PAY_PORT:-5004}:5004"
    environment:
      - PORT=5004
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/food_delivery_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkeyforfooddeliverymicroservices2025}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder_key_skydish_dev}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder_key_skydish_dev}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:3000/payment/vnpay/callback}
      - MOMO_PARTNER_CODE=${MOMO_PARTNER_CODE:-}
      - MOMO_ACCESS_KEY=${MOMO_ACCESS_KEY:-}
      - MOMO_SECRET_KEY=${MOMO_SECRET_KEY:-}
      - MOMO_ENDPOINT=${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      - MOMO_REDIRECT_URL=${MOMO_REDIRECT_URL:-http://localhost:3000/payment/momo/callback}
      - MOMO_IPN_URL=${MOMO_IPN_URL:-http://localhost:5004/api/payment/momo/ipn}
      - BANK_TRANSFER_ENABLED=${BANK_TRANSFER_ENABLED:-true}
      - BANK_ID=${BANK_ID:-970422}
      - BANK_CODE=${BANK_CODE:-MB}
      - BANK_NAME=${BANK_NAME:-MB Bank}
      - BANK_ACCOUNT_NUMBER=${BANK_ACCOUNT_NUMBER:-}
      - BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME:-}
      - VIETQR_TEMPLATE=${VIETQR_TEMPLATE:-compact2}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID}
    container_name: skydish-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:4000}
      - REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - delivery-service
      - payment-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
  restaurant-uploads:

networks:
  default:
    name: skydish-network