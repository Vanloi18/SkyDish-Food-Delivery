server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Docker internal DNS resolver with 5s TTL for dynamic container IP discovery
    resolver 127.0.0.11 valid=5s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;

    # SPA routing: fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy backend APIs if accessed directly through frontend port 3000
    location /api/auth {
        set $upstream_auth "http://auth-service:4000";
        proxy_pass $upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/restaurant {
        set $upstream_rest "http://restaurant-service:5002";
        proxy_pass $upstream_rest;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/food-items {
        set $upstream_food "http://restaurant-service:5002";
        proxy_pass $upstream_food;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/coupons {
        set $upstream_coupon "http://restaurant-service:5002";
        proxy_pass $upstream_coupon;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/search {
        set $upstream_search "http://restaurant-service:5002";
        proxy_pass $upstream_search;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/superadmin {
        set $upstream_superadmin "http://restaurant-service:5002";
        proxy_pass $upstream_superadmin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/superAdmin {
        set $upstream_superAdmin "http://restaurant-service:5002";
        proxy_pass $upstream_superAdmin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/reviews {
        set $upstream_review "http://restaurant-service:5002";
        proxy_pass $upstream_review;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/notifications {
        set $upstream_notif "http://restaurant-service:5002";
        proxy_pass $upstream_notif;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/users {
        set $upstream_users "http://order-service:5005";
        proxy_pass $upstream_users;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/orders {
        set $upstream_order "http://order-service:5005";
        proxy_pass $upstream_order;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/delivery {
        set $upstream_delivery "http://delivery-service:5003";
        proxy_pass $upstream_delivery;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/payment {
        set $upstream_payment "http://payment-service:5004";
        proxy_pass $upstream_payment;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ai {
        set $upstream_ai "http://ai-service:5006";
        proxy_pass $upstream_ai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Static uploads from restaurant-service
    location /uploads {
        set $upstream_uploads "http://restaurant-service:5002";
        proxy_pass $upstream_uploads;
        proxy_set_header Host $host;
    }

    # WebSocket / Socket.IO reverse proxy for real-time events
    location /socket.io/ {
        set $upstream_order_ws "http://order-service:5005";
        proxy_pass $upstream_order_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /delivery-socket.io/ {
        set $upstream_delv_ws "http://delivery-service:5003";
        rewrite ^/delivery-socket.io/(.*) /socket.io/$1 break;
        proxy_pass $upstream_delv_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
